name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Browser smoke tests (ticket #1197): real Chromium against the dev server,
  # covering what happy-dom cannot see (layout geometry, real event handling).
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
